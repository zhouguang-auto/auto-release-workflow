name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          echo "自动发布成功" > release-assets/release.txt
          echo "Version: ${{ github.event.inputs.version || github.ref_name }}" >> release-assets/release.txt
          echo "Generated at: $(date -u)" >> release-assets/release.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*